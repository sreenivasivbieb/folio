<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Folio: two stacked pages (your files, kept in one place) carrying a small knowledge graph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D63F5"/>
      <stop offset="0.55" stop-color="#7C5CF6"/>
      <stop offset="1" stop-color="#EC4F9C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1050" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#shine)"/>
  <!-- back page -->
  <rect x="372" y="236" width="400" height="520" rx="72" fill="#FFFFFF" fill-opacity="0.38" transform="rotate(9 572 496)"/>
  <!-- front page -->
  <g filter="url(#shadow)">
    <rect x="268" y="276" width="400" height="520" rx="72" fill="#FFFFFF"/>
  </g>
  <!-- knowledge graph on the page -->
  <g stroke="#B9AEF8" stroke-width="22" stroke-linecap="round">
    <line x1="378" y1="440" x2="548" y2="392"/>
    <line x1="378" y1="440" x2="520" y2="620"/>
    <line x1="548" y1="392" x2="520" y2="620"/>
  </g>
  <circle cx="378" cy="440" r="46" fill="#3D63F5"/>
  <circle cx="548" cy="392" r="40" fill="#7C5CF6"/>
  <circle cx="520" cy="620" r="50" fill="#EC4F9C"/>
</svg>
